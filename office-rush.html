<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Rush – Chạy đua văn phòng</title>
<style>
:root{--bg1:#1d2b53;--bg2:#3b1f5e;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg1:#0f1530;--bg2:#24123d}}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);overflow:hidden}
canvas{height:calc(100% - 28px);max-width:100%;aspect-ratio:2/3;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.45);touch-action:none}
p{margin:6px 0 0;font-size:12px;opacity:.75}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<p>A / D (hoặc ←/→) để né · Space để bắt đầu · Chạm trái/phải trên điện thoại</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=480,H=720,LX=[140,240,340],PY=590;
const PAL=[
 {f:'#8fd3f4',s:'#6bb6e0',w:'#ffd166',a:'#ef476f'},
 {f:'#9be8c1',s:'#6fd0a0',w:'#ffb3c1',a:'#118ab2'},
 {f:'#c7b8ff',s:'#a594f0',w:'#8ee3ef',a:'#ff6b6b'},
 {f:'#ffcfa3',s:'#ffb77a',w:'#9bf6ff',a:'#7b2cbf'},
 {f:'#ffa8d1',s:'#ff80b8',w:'#ffe66d',a:'#3a86ff'}
];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const x=hex(a),y=hex(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')'};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let cur={...PAL[0]},from={...PAL[0]},to={...PAL[0]},pt=1;
const OB=['🪑','🗑️','📦','🖨️','🪴','🗄️'];
let S='menu',px=240,lane=1,vx=0,speed=300,dist=0,scroll=0,lvl=1,meters=0,coins=0,best=0,next=200,obs=[],items=[],parts=[],shake=0,flash=0,banner=0,t=0,overT=0,step=0;
try{best=+localStorage.getItem('orbest')||0}catch(e){}
function reset(){S='play';lane=1;px=240;speed=300;dist=0;lvl=1;meters=0;coins=0;next=200;obs=[];items=[];parts=[];cur={...PAL[0]};from={...PAL[0]};to={...PAL[0]};pt=1;banner=1.5}
function move(d){if(S!=='play')return;lane=Math.max(0,Math.min(2,lane+d))}
addEventListener('keydown',e=>{
 if(e.repeat)return;const k=e.key.toLowerCase();
 if(k==='a'||k==='arrowleft')move(-1);
 else if(k==='d'||k==='arrowright')move(1);
 else if((k===' '||k==='enter')&&(S==='menu'||(S==='over'&&overT>.5))){e.preventDefault();reset()}
});
cv.addEventListener('pointerdown',e=>{
 if(S!=='play'){if(S==='menu'||overT>.5)reset();return}
 const r=cv.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1);
});
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*220;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,c})}}
function spawn(){
 const f=Math.random()*3|0,two=lvl>=2&&Math.random()<.55;
 for(let i=0;i<3;i++){if(i===f)continue;
  if(!two&&i!==(f+1+(Math.random()<.5?1:0))%3)continue;
  obs.push({l:i,y:-60,e:OB[Math.random()*OB.length|0]});}
 if(Math.random()<.65)items.push({l:f,y:-60,p:Math.random()*6});
}
function levelUp(){from={...cur};to=PAL[(lvl-1)%PAL.length];pt=0;banner=1.8;flash=.5}
function die(){S='over';overT=0;shake=.6;burst(px,PY,'#ef476f',40);burst(px,PY,'#ffd166',25);
 if(meters>best){best=meters;try{localStorage.setItem('orbest',best)}catch(e){}}}
function update(dt){
 t+=dt;
 if(pt<1){pt=Math.min(1,pt+dt/1.4);const k=ease(pt);for(const n in cur)cur[n]=mix(from[n],to[n],k)}
 else if(typeof cur.f!=='string'||cur.f[0]!=='#'){}
 if(banner>0)banner-=dt;if(flash>0)flash-=dt;if(shake>0)shake-=dt;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt}
 parts=parts.filter(p=>p.l>0);
 if(S==='over'){overT+=dt;scroll+=40*dt;return}
 if(S==='menu'){scroll+=120*dt;return}
 speed=Math.min(900,300+(lvl-1)*45);
 dist+=speed*dt;scroll+=speed*dt;step+=dt*speed/32;
 meters=dist/20|0;
 const nl=1+(meters/200|0);if(nl>lvl){lvl=nl;levelUp()}
 next-=speed*dt;if(next<=0){spawn();next=120+speed*.5}
 const tx=LX[lane];vx=(tx-px)*Math.min(1,dt*14)/Math.max(dt,.001);px+=(tx-px)*Math.min(1,dt*14);
 for(const o of obs){o.y+=speed*dt;if(Math.abs(LX[o.l]-px)<48&&Math.abs(o.y-PY)<42){die();return}}
 for(const c of items){c.y+=speed*dt;if(!c.d&&Math.abs(LX[c.l]-px)<45&&Math.abs(c.y-PY)<48){c.d=1;coins++;dist+=100;burst(LX[c.l],c.y,'#ffd166',14)}}
 obs=obs.filter(o=>o.y<H+80);items=items.filter(c=>!c.d&&c.y<H+80);
}
function txt(s,x,y,size,col,al){g.font='800 '+size+'px system-ui,sans-serif';g.textAlign=al||'center';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function emoji(e,x,y,s){g.font=s+'px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,x,y);g.textBaseline='alphabetic'}
function draw(){
 g.save();
 if(shake>0)g.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*14*shake);
 // tường hai bên
 g.fillStyle=cur.w;g.fillRect(-20,-20,W+40,H+40);
 // sàn
 g.fillStyle=cur.f;g.fillRect(90,0,300,H);
 g.fillStyle=cur.s;
 for(let i=-1;i<12;i++){const y=((i*70+scroll)%840)-70;g.fillRect(90,y,300,35)}
 g.fillStyle='rgba(255,255,255,.7)';
 for(const x of[190,290])for(let i=-1;i<10;i++){const y=((i*100+scroll)%1000)-100;g.fillRect(x-3,y,6,50)}
 g.fillStyle='rgba(0,0,0,.12)';g.fillRect(90,0,8,H);g.fillRect(382,0,8,H);
 // đồ nội thất hai bên
 const dec=['🖥️','🪴','🗂️','☕','📠','🪟'];
 for(let i=-1;i<7;i++){const y=((i*130+scroll*.9)%910)-90,k=Math.abs(Math.floor((scroll*.9)/910)*7+i)%6;
  emoji(dec[k],45,y,44);emoji(dec[(k+3)%6],435,y,44)}
 // vật phẩm
 for(const c of items){const y=c.y+Math.sin(t*5+c.p)*5;
  g.fillStyle='rgba(0,0,0,.15)';g.beginPath();g.ellipse(LX[c.l],c.y+20,20,7,0,0,6.28);g.fill();emoji('☕',LX[c.l],y,38)}
 // chướng ngại
 for(const o of obs){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(LX[o.l],o.y+28,32,9,0,0,6.28);g.fill();emoji(o.e,LX[o.l],o.y,62)}
 // nhân vật
 if(S!=='over'){
  g.save();g.translate(px,PY);g.rotate(Math.max(-.3,Math.min(.3,vx*.0007)));
  g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(0,34,22,7,0,0,6.28);g.fill();
  const sw=Math.sin(step)*10;
  g.fillStyle='#2b2d42';g.fillRect(-12,12,9,22+sw*.5);g.fillRect(3,12,9,22-sw*.5);
  g.fillStyle='#f8f9fa';g.beginPath();g.roundRect(-16,-18,32,34,8);g.fill();
  g.fillStyle=cur.a;g.beginPath();g.moveTo(-4,-14);g.lineTo(4,-14);g.lineTo(3,10);g.lineTo(-3,10);g.fill();
  g.fillStyle='#8d5524';g.fillRect(16,2+sw*.3,12,14);
  g.fillStyle='#ffcc99';g.beginPath();g.arc(0,-28,13,0,6.28);g.fill();
  g.fillStyle='#3d2b1f';g.beginPath();g.arc(0,-31,13,3.3,6.1);g.fill();
  g.restore();
 }
 for(const p of parts){g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.fillRect(p.x,p.y,6,6)}
 g.globalAlpha=1;
 g.restore();
 // HUD
 if(S!=='menu'){
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.roundRect(12,12,456,48,14);g.fill();
  txt(meters+' m',28,43,24,'#fff','left');txt('LV '+lvl,240,43,24,'#ffd166');txt('☕ '+coins,452,43,24,'#fff','right');
 }
 if(banner>0&&S==='play'){const a=Math.min(1,banner),k=ease(Math.min(1,(1.8-banner)*3));
  g.save();g.globalAlpha=a;g.translate(240,300);g.scale(.6+.4*k,.6+.4*k);
  txt(lvl===1?'BẮT ĐẦU!':'LEVEL '+lvl,0,0,56,'#fff');
  g.lineWidth=0;txt(lvl===1?'Tới giờ họp rồi, chạy!':'Tốc độ tăng!',0,38,22,'#fff');g.restore()}
 if(flash>0){g.fillStyle='rgba(255,255,255,'+flash*.8+')';g.fillRect(0,0,W,H)}
 if(S==='menu'||S==='over'){
  g.fillStyle='rgba(20,20,50,.62)';g.fillRect(0,0,W,H);
  if(S==='menu'){
   txt('OFFICE RUSH',240,250,54,'#ffd166');txt('Chạy đua văn phòng',240,290,22);
   txt('A / D hoặc ←/→ : né chướng ngại',240,360,19);txt('Nhặt ☕ để cộng điểm',240,392,19);
   txt('Mỗi 200 m lên 1 level, chạy nhanh hơn',240,424,19);
  }else{
   txt('TRỄ HỌP RỒI! 😵',240,260,40,'#ef476f');
   txt(meters+' m · Level '+lvl,240,320,30);txt('☕ '+coins+'   🏆 Kỷ lục: '+best+' m',240,362,22);
  }
  g.globalAlpha=.6+.4*Math.sin(t*5);
  txt(S==='menu'?'Nhấn SPACE hoặc chạm để bắt đầu':'Nhấn SPACE hoặc chạm để chơi lại',240,520,20,'#fff');g.globalAlpha=1;
 }
}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
